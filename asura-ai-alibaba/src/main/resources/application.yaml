
server:
  port: 8080

spring:
  application:
    name: asura-ai-alibaba
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.elasticsearch.autoconfigure.ElasticsearchVectorStoreAutoConfiguration
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-max
          temperature: 0.7
          max-tokens: 2048
    agent:
      name: Asura AI Agent
      description: 基于 Spring AI 的智能代理服务
      tools:
        - name: weather
          enabled: true
        - name: calculator
          enabled: true
        - name: vector_search
          enabled: true

logging:
  level:
    org.asura.ai.alibaba: DEBUG
    org.springframework.ai: DEBUG
    org.asura.ai.alibaba.service.impl.AgentServiceImpl: INFO