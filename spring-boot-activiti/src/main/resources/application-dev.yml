server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: springboot-activiti-demo

  # 数据源配置
  datasource:
    # 使用H2内存数据库进行开发和测试
    url: jdbc:h2:mem:activiti;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

    # 生产环境可以切换到MySQL
    # url: jdbc:mysql://localhost:3306/activiti?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    # driver-class-name: com.mysql.cj.jdbc.Driver
    # username: root
    # password: your_password

  # JPA配置
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # H2控制台配置（开发时使用）
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  # Jackson配置
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: GMT+8

# Activiti配置
activiti:
  # 数据库配置
  database-schema-update: true
  db-identity-used: true
  history-level: full

  # 流程定义配置
  check-process-definitions: true
  deployment-mode: default

  # 异步执行器配置
  async-executor-activate: false

  # 邮件配置（可选）
  mail-server-host: localhost
  mail-server-port: 587
  mail-server-use-tls: false
  mail-server-username:
  mail-server-password:

# 日志配置
logging:
  level:
    com.example.workflow: DEBUG
    org.activiti: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,activiti
      base-path: /actuator
  endpoint:
    health:
      show-details: always

# 自定义配置
workflow:
  # 默认审批配置
  approval:
    # 请假审批配置
    leave:
      manager-required: true
      hr-required-days: 3
      auto-approve-days: 1

    # 采购审批配置
    purchase:
      department-required: true
      finance-required-amount: 5000
      ceo-required-amount: 20000

  # 通知配置
  notification:
    email:
      enabled: false
      smtp-host: smtp.example.com
      smtp-port: 587
    sms:
      enabled: false
      provider: aliyun

# 开发环境配置
---
spring:
  config:
    activate:
      on-profile: dev

  # 开发环境数据源（H2）
  datasource:
    url: jdbc:h2:mem:activiti_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

logging:
  level:
    root: INFO
    com.example.workflow: DEBUG

---
# 测试环境配置
spring:
  config:
    activate:
      on-profile: test

  # 测试环境数据源（H2）
  datasource:
    url: jdbc:h2:mem:activiti_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

logging:
  level:
    root: WARN
    com.example.workflow: DEBUG

---
# 生产环境配置
spring:
  config:
    activate:
      on-profile: prod

  # 生产环境数据源（MySQL）
  datasource:
    url: jdbc:mysql://localhost:3306/activiti_prod?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:activiti_user}
    password: ${DB_PASSWORD:activiti_password}

  jpa:
    show-sql: false

  h2:
    console:
      enabled: false

# Activiti生产配置
activiti:
  async-executor-activate: true

logging:
  level:
    root: INFO
    com.example.workflow: INFO
    org.activiti: WARN
  file:
    name: logs/workflow-application.log