server:
  port: 8080

spring:
  application:
    name: asura-flowable
  datasource:
    url: jdbc:h2:mem:flowable;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console

flowable:
  database-schema-update: true
  async-executor-activate: false
  idm:
    enabled: false

logging:
  level:
    org.flowable: INFO
    org.asura.flowable: DEBUG
