server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: asura-statemachine

logging:
  level:
    root: INFO
    org.asura.statemachine: DEBUG
    org.springframework.statemachine: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always