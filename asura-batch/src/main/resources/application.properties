spring.application.name=asura-batch
server.port=8071

spring.batch.job.enabled=false

logging.level.root=WARN
logging.level.org.springframework.web=DEBUG
logging.level.org.asura.batch=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p ${PID:- } --- [%15.15t] %-40.40logger{39} %4line: %m%n
