# Akka Configuration for Testing

akka {
  loglevel = INFO
  logging-filter = "akka.event.slf4j.Slf4jLoggingFilter"
  
  # Use local actor provider for testing (no clustering)
  actor {
    provider = "local"
    
    default-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor {
        core-pool-size-min = 4
        core-pool-size-max = 8
        max-pool-size = 16
        keep-alive-time = 60s
        queue-size = 1000
      }
      throughput = 100
    }
  }

  # Serialization
  serialization {
    serialization-bindings {
      "java.io.Serializable" = jackson-cbor
      "java.lang.Object" = jackson-cbor
    }
  }
}