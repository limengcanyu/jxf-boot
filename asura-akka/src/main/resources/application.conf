# Akka Configuration for asura-akka

# Logging
akka {
  loglevel = INFO
  logging-filter = "akka.event.slf4j.Slf4jLoggingFilter"
  
  # Actor Provider - must be 'cluster' for clustering
  actor {
    provider = "cluster"
    
    default-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor {
        core-pool-size-min = 8
        core-pool-size-max = 32
        max-pool-size = 64
        keep-alive-time = 60s
        queue-size = 10000
      }
      throughput = 100
    }
    
    sharding-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor {
        core-pool-size-min = 16
        core-pool-size-max = 64
        max-pool-size = 128
        keep-alive-time = 60s
        queue-size = 20000
      }
      throughput = 50
    }
  }

  # Remote communication
  remote {
    artery {
      enabled = on
      transport = tcp
      canonical {
        hostname = "127.0.0.1"
        port = 2552
      }
      flow-control {
        max-outgoing-bytes = 10485760
        max-incoming-bytes = 10485760
      }
    }
  }

  # Cluster configuration
  cluster {
    roles = ["counter"]
    
    seed-nodes = [
      "akka://asura-akka-system@127.0.0.1:2552",
      "akka://asura-akka-system@127.0.0.1:2553",
      "akka://asura-akka-system@127.0.0.1:2554"
    ]
    
    failure-detector {
      threshold = 10.0
      heartbeat-interval = 1s
      acceptable-heartbeat-pause = 3s
    }
    
    sharding {
      number-of-shards = 100
      entity-idle-timeout = 10m
      shard-startup-timeout = 60s
    }
  }

  # Serialization
  serialization {
    serialization-bindings {
      "java.io.Serializable" = jackson-cbor
      "java.lang.Object" = jackson-cbor
    }
  }
}